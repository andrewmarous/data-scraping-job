name: Tests
on: [push, pull_request]
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run python -m pytest
      - run: cp config.example.toml config.toml
      - run: uv run collector init
      - run: uv run collector collect
      - run: uv run collector status --json
      - run: uv build
