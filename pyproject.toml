[project]
name = "launchd-collector-template"
version = "0.1.0"
description = "A small launchd collection job backed by local SQLite"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1"]

[project.scripts]
collector = "collector.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
