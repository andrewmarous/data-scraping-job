[project]
name = "local-market-data"
version = "0.1.0"
description = "Local, provenance-preserving market data collector"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "typer>=0.12,<1"]

[project.scripts]
market-data = "market_data.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
